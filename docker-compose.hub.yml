# Despliegue con las imágenes publicadas en Docker Hub por el flujo CI/CD (.github/workflows/ci-cd.yml),
# sin compilar en el servidor. Se combina con el stack de producción:
#
#   DOCKERHUB_NAMESPACE=<usuario> IMAGE_TAG=1.2.3 \
#     docker compose -f docker-compose.prod.yml -f docker-compose.hub.yml pull
#   DOCKERHUB_NAMESPACE=<usuario> IMAGE_TAG=1.2.3 \
#     docker compose -f docker-compose.prod.yml -f docker-compose.hub.yml up -d --no-build
#
# IMAGE_TAG: latest (último master), sha-<commit> o una versión X.Y.Z. El frontend espera que el
# servicio del backend se llame "backend" (nginx.conf: proxy_pass http://backend:8080).

services:
  backend:
    image: ${DOCKERHUB_NAMESPACE:?defina DOCKERHUB_NAMESPACE}/parking-backend:${IMAGE_TAG:-latest}
    pull_policy: always

  frontend:
    image: ${DOCKERHUB_NAMESPACE:?defina DOCKERHUB_NAMESPACE}/parking-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
