# Cabeceras de seguridad de la SPA (revision OWASP A05, 2026-09-29). Se incluye en cada "location"
# que sirve la app: en nginx, un add_header dentro de un location ANULA los heredados del server.
# /api/ no las incluye: el backend (Spring Security) ya envia las suyas.
#
# CSP estricta: el build de Vite no tiene scripts en linea (verificado), todo sale del mismo origen
# (fuentes y assets empaquetados localmente) y la app no se puede embeber en iframes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# HSTS solo tiene sentido con HTTPS: agregarlo en el proxy que termine TLS en produccion
# (Strict-Transport-Security "max-age=31536000; includeSubDomains").
