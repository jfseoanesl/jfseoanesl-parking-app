# Fase 11 - Contenedorizacion. Sirve la SPA con fallback a index.html (React Router en modo
# "browser") y reenvia /api/** al servicio "backend" de docker-compose - el navegador solo ve
# un origen (este servidor), igual que el proxy de Vite en desarrollo (vite.config.ts).
server {
    listen 80;
    server_name _;
    # OWASP A05: no revelar la version de nginx en la cabecera Server ni en paginas de error.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # $http_host (no $host): conserva el puerto publicado (ej. localhost:8081). Con $host el
        # backend ve Host sin puerto, el Origin del navegador no coincide y Spring rechaza los
        # POST como "Invalid CORS request" (403) aunque la peticion sea del mismo origen.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }

    # El service worker y el manifest no deben quedar cacheados de forma agresiva por el proxy
    # del navegador entre despliegues (vite-plugin-pwa ya versiona los assets con hash).
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        # El mime.types de nginx no incluye .webmanifest (lo servia como application/octet-stream).
        # Como la extension no esta en mime.types, se aplica este default_type.
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
